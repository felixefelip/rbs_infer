name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      steep_ref:
        description: "felixefelip/steep ref to test against (a paired PR's branch, say)"
        default: rbs_infer
      rbs_rails_ref:
        description: "felixefelip/rbs_rails ref to test against"
        default: rbs_infer

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The Gemfiles reach the two forks by relative path — `../steep` here,
      # `../../../steep` and `../../../rbs_rails` in the dummy app — so the three
      # repos are checked out side by side, as they are locally.
      - uses: actions/checkout@v4
        with:
          path: rbs_infer

      - uses: actions/checkout@v4
        with:
          repository: felixefelip/steep
          ref: ${{ inputs.steep_ref || 'rbs_infer' }}
          path: steep

      - uses: actions/checkout@v4
        with:
          repository: felixefelip/rbs_rails
          ref: ${{ inputs.rbs_rails_ref || 'rbs_infer' }}
          path: rbs_rails

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: rbs_infer
          bundler-cache: true

      # The dummy app has a bundle of its own, which the suite installs and runs
      # in subprocesses (spec/integration/steep_dummy_spec.rb). Its gems live
      # outside the checkout, so nothing that globs the dummy's sources reads them.
      - name: Cache the dummy app's gems
        uses: actions/cache@v4
        with:
          path: ~/dummy-bundle
          key: dummy-bundle-${{ runner.os }}-${{ hashFiles('rbs_infer/.ruby-version', 'rbs_infer/spec/dummy/Gemfile.lock') }}

      # Not frozen: the forks are path gems that move on their own branches, so
      # the dependencies their gemspecs declare can drift from what the lock
      # recorded. Rubygems versions stay pinned by the lock either way.
      - name: Install the dummy app's gems
        working-directory: rbs_infer/spec/dummy
        run: |
          bundle config set --local path "$HOME/dummy-bundle"
          bundle install --jobs 4

      - name: Run the suite
        working-directory: rbs_infer
        run: bundle exec rspec

      # SimpleCov writes it even when an example fails.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: rbs_infer/coverage/
          retention-days: 14

  # A result of its own, next to the suite's: the totals, the least covered
  # files and, on a pull request, the coverage of the lines it changes, with
  # the uncovered ones annotated on the diff. It fails when a total is below
  # its minimum; the suite's own result is left to the `rspec` job.
  coverage:
    needs: rspec
    if: ${{ !cancelled() && needs.rspec.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The whole history: patch coverage diffs against the pull request's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      # Only the `simplecov` CLI, at the version the suite ran with: the
      # project's bundle needs the forks checked out beside it.
      - uses: ruby/setup-ruby@v1

      - name: Install the SimpleCov CLI
        run: gem install simplecov --no-document --version "$(sed -n 's/^    simplecov (\(.*\))$/\1/p' Gemfile.lock)"

      - name: Summarize
        env:
          BASE_REF: ${{ github.base_ref }}
          # Raise these as coverage grows; never lower them to pass.
          MIN_LINE_COVERAGE: 94
          MIN_BRANCH_COVERAGE: 79
        run: |
          read -r line_pct line_cov line_total branch_pct branch_cov branch_total < <(
            simplecov report --json | jq -r '.total | [
              (.lines.percent * 100 | round / 100), .lines.covered, .lines.total,
              (.branches.percent * 100 | round / 100), .branches.covered, .branches.total
            ] | @tsv'
          )
          echo "::notice title=Coverage::Lines ${line_pct}%, branches ${branch_pct}%"

          {
            echo "## Coverage"
            echo
            echo "| | Covered | Total | % | Minimum |"
            echo "|---|---:|---:|---:|---:|"
            echo "| Lines | ${line_cov} | ${line_total} | ${line_pct}% | ${MIN_LINE_COVERAGE}% |"
            echo "| Branches | ${branch_cov} | ${branch_total} | ${branch_pct}% | ${MIN_BRANCH_COVERAGE}% |"
            echo
            if [ -n "$BASE_REF" ]; then
              echo "### Lines this pull request changes"
              echo
              echo '```'
              simplecov patch --base "origin/$BASE_REF" --no-color
              echo '```'
              echo
            fi
            echo "### Least covered files"
            echo
            echo '```'
            simplecov uncovered --top 15 --no-color
            echo '```'
            echo
            echo "The HTML report is the \`coverage\` artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$BASE_REF" ]; then
            simplecov patch --base "origin/$BASE_REF" --annotate github
          fi

          below=0
          check() { # name, percent, minimum
            if awk -v pct="$2" -v min="$3" 'BEGIN { exit !(pct < min) }'; then
              echo "::error title=Coverage below minimum::$1 coverage is $2%, under the minimum of $3%"
              echo "**$1 coverage is $2%, under the minimum of $3%.**" >> "$GITHUB_STEP_SUMMARY"
              below=1
            fi
          }
          check Line "$line_pct" "$MIN_LINE_COVERAGE"
          check Branch "$branch_pct" "$MIN_BRANCH_COVERAGE"
          exit "$below"
