inherit_from: .rubocop_todo.yml

require:
  - ./.rubocop/class_length_ceiling.rb

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "spec/dummy/**/*"
    - "spec/expectations/**/*"
    - "coverage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
  Max: 20

# Replaced by Project/ClassLengthCeiling, which takes the same settings plus a
# per-file ceiling.
Metrics/ClassLength:
  Enabled: false

Project/ClassLengthCeiling:
  Enabled: true
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
  Max: 400
  Ceilings:
    "lib/rbs_infer/inference/new_call_collector.rb": 740
    "lib/rbs_infer/inference/param_type_inferrer.rb": 457
    "lib/rbs_infer/signatures/steep_bridge.rb": 401

Metrics/ModuleLength:
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
  Max: 400

Metrics/BlockLength:
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
  inherit_mode:
    merge: ["Exclude"]
  Exclude:
    - "spec/**/*"

Style/IfUnlessModifier:
  Enabled: false

Style/GuardClause:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false
